name: app-ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crypto/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "crypto/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/app-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lint --no-daemon

      - name: Check for disqualifying dependencies (Play Services / common trackers)
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > deps.txt
          if grep -Ei "play-services|firebase|crashlytics|google-analytics" deps.txt; then
            echo "::error::Found a dependency that is likely disqualifying for F-Droid inclusion"
            exit 1
          fi
