name: app-ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crypto/**"
      - "core/**"
      - "backup/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "crypto/**"
      - "core/**"
      - "backup/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/app-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship a full Android SDK already (at
      # $ANDROID_HOME); android-actions/setup-android@v3 additionally tries
      # to install the long-removed legacy "tools" package and fails
      # outright, so it's dropped rather than fixed. AGP auto-downloads any
      # specific platform/build-tools version it still needs, provided
      # licenses are accepted.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lint --no-daemon

      - name: Check for disqualifying dependencies (Play Services / common trackers)
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > deps.txt
          if grep -Ei "play-services|firebase|crashlytics|google-analytics" deps.txt; then
            echo "::error::Found a dependency that is likely disqualifying for F-Droid inclusion"
            exit 1
          fi
